groups:
  - name: notes-devops
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is not answering"

      - alert: WebsiteDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down (checked from the monitoring server)"

      - alert: CertificateExpiresSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "HTTPS certificate of {{ $labels.instance }} expires in less than 14 days"

      - alert: HighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU of {{ $labels.instance }} above 85% for 10 minutes"

      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has less than 10% memory free"

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk / of {{ $labels.instance }} is more than 85% full"

      - alert: AppHighErrorRate
        expr: >
          sum(rate(http_requests_total{job="notes-app",status=~"5.."}[5m]))
          / sum(rate(http_requests_total{job="notes-app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of app requests fail with a 5xx error"

      - alert: AppSlow
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="notes-app"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95% of app requests take longer than 1 second"
