- name: Add the official Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key

- name: Install Grafana Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Let Alloy read the system journal and Docker logs
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
      - docker
    append: true
  notify: Restart alloy

- name: Write the Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart alloy

- name: Start Alloy now and at boot
  ansible.builtin.systemd_service:
    name: alloy
    state: started
    enabled: true
