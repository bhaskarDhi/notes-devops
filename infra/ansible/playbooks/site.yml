- name: Base setup (all servers)
  hosts: all
  become: true
  roles:
    - common
    - docker
    - node_exporter

- name: HTTPS reverse proxy (app and Jenkins)
  hosts: app:jenkins
  become: true
  roles:
    - caddy

- name: Jenkins (installed and configured as code)
  hosts: jenkins
  become: true
  roles:
    - jenkins
    - role: ecr_login
      vars:
        ecr_login_users:
          - name: jenkins
            home: /var/lib/jenkins

- name: Monitoring server (Prometheus, Alertmanager, Blackbox, Loki, Grafana)
  hosts: monitoring
  become: true
  roles:
    - monitoring

- name: Container metrics on the app server
  hosts: app
  become: true
  roles:
    - cadvisor

- name: Send logs to Loki (all servers)
  hosts: all
  become: true
  roles:
    - alloy
